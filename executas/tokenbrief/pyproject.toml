[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-dev-tokenbrief"
version = "0.1.0"
description = "Executa for the tokenbrief Anna App"
requires-python = ">=3.10"

[project.scripts]
"tool-dev-tokenbrief" = "tokenbrief_plugin:main"

[tool.setuptools]
py-modules = ["tokenbrief_plugin"]
